---
# yamllint disable rule:line-length
docker:
  image: yegor256/java
assets:
  docker-password: yegor256/home#assets/docker-password
install: |
  sudo /usr/bin/install-node.sh
  sudo make install clean "--directory=$(pwd)"
merge:
  script: |-
    sudo docker build "$(pwd)"
    sudo make -C "$(pwd)" target/html/simple.html
release:
  pre: false
  script: |-
    [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit -1
    sudo make -C "$(pwd)" "PAGES_ACTION_VERSION=${tag}" target/html/simple.html
    repo=yegor256/pages-action
    sudo docker build "$(pwd)" --build-arg "VERSION=${tag}" --tag "${repo}:${tag}"
    sudo docker build "$(pwd)" --build-arg "VERSION=${tag}" --tag "${repo}:latest"
    cat ../docker-password | sudo docker login --password-stdin -u yegor256
    sudo docker push "${repo}:${tag}"
    sudo docker push "${repo}:latest"
    digest=$(sudo docker inspect --format '{{index .RepoDigests 0}}' "${repo}:${tag}")
    [[ "${digest}" =~ ^${repo}@sha256:[0-9a-f]{64}$ ]] || exit -1
    sed -i -E "s|docker://${repo}@sha256:[0-9a-f]{64}|docker://${digest}|" action.yml
    grep -q "docker://${digest}" action.yml
    git add action.yml
    git commit -m "version set to ${tag}"
