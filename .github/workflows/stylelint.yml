---
# yamllint disable rule:line-length
name: stylelint
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  stylelint:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --global stylelint@18.0.0 stylelint-config-standard@41.0.0
      - run: stylelint --config-basedir "$(npm root -g)" sass/*.scss
